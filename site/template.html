<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>{{TITLE}} &mdash; {{AUTHOR}}</title>
	<link rel="alternate" type="application/rss+xml" title="Modern Classics" href="feed.xml">
	<link rel="alternate" type="application/atom+xml;profile=opds-catalog;kind=acquisition" title="Modern Classics OPDS catalog" href="opds.atom">
<style>
html {
  max-width: 70ch;
  padding: 3em 1em;
  margin: auto;
  line-height: 1.75;
  font-size: 1.25em;
}

body {
	font: large/1.556 "Libertine", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
}

h1,h2,h3,h4,h5,h6 {
  margin: 3em 0 1em;
	font-family: "Essays 1743", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
}

h1 {
  margin-top: 1em;
  text-align: center;
}

h4 {
  margin: 2em 0 1em;
  font-style: italic;
  font-weight: 600;
}

p,ul,ol {
  margin-bottom: 2em;
  color: #1d1d1d;
  font-family: Georgia, "Palatino Linotype", "Book Antiqua", serif;
}

blockquote {
  margin: 1.5em 2em;
  padding-left: 1em;
  border-left: 3px solid #ccc;
  font-style: italic;
}

blockquote p {
  margin-bottom: 1em;
}

pre.outline {
  font-family: Georgia, "Palatino Linotype", "Book Antiqua", serif;
  white-space: pre-wrap;
  line-height: 1.6;
  margin-bottom: 2em;
  color: #1d1d1d;
}

figure {
  margin: 2.5em auto;
  text-align: center;
}

figure + figure {
  margin-top: 1em;
}

figure img {
  max-width: 100%;
  height: auto;
  background: #fff;
}

table.plates {
  width: 100%;
  margin: 2.5em 0;
  border-collapse: collapse;
  font-family: Georgia, "Palatino Linotype", "Book Antiqua", serif;
  line-height: 1.5;
}

table.plates td {
  padding: 0.4em 0.8em;
  vertical-align: middle;
  border-bottom: 1px solid #e6e2da;
}

table.plates tr:last-child td {
  border-bottom: none;
}

table.plates figure,
table.plates figure + figure {
  margin: 0.4em auto;
}

table.plates figcaption {
  display: none;
}

figcaption {
  margin-top: 0.6em;
  font-family: Georgia, "Palatino Linotype", "Book Antiqua", serif;
  font-size: 0.8em;
  line-height: 1.5;
  color: #4a4a4a;
  text-align: left;
}

.center {
  text-align: center;
}

.subtitle {
  text-align: center;
  font-style: italic;
  margin-top: -1em;
  margin-bottom: 3em;
}

.toc-book {
  font-weight: bold;
  margin-top: 1em;
  font-family: "Essays 1743", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
}

.toc-list {
  list-style: none;
  padding-left: 1.5em;
}

.toc-list li {
  margin-bottom: 0.3em;
}
</style>
</head>

<body>
	<center>
	<h1>{{TITLE}}</h1>
{{SUBTITLE_BLOCK}}	<h3>by {{AUTHOR}}</h3>
	<p class="center">
	{{DATE_LINE}}
	</p>
	</center>

	<hr>
	{{INTRO}}

	<hr>
<h2 id="contents">Contents</h2>
{{TOC}}

<hr>
{{BODY}}

</body>
</html>
